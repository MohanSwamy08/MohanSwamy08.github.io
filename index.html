<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mohan Swamy | Personal Links</title>

    <meta name="description"
          content="Mohan Swamy Pala - AI & Data Science Student">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --white: #ffffff;
            --light: rgba(255,255,255,0.75);
            --glass: rgba(255,255,255,0.10);
            --border: rgba(255,255,255,0.25);
            --blue: #38bdf8;
            --purple: #8b5cf6;
        }

        /* =========================
           BODY
        ========================= */

        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: var(--white);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 15px;

            overflow-x: hidden;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(56,189,248,0.25),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 80% 80%,
                    rgba(139,92,246,0.28),
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    #020617,
                    #071a33,
                    #090b25
                );
        }


        /* =========================
           GLOWING ORBS
        ========================= */

        .orb {

            position: fixed;

            border-radius: 50%;

            filter: blur(5px);

            opacity: 0.55;

            z-index: -1;

            animation: float 8s ease-in-out infinite;
        }

        .orb-one {

            width: 180px;
            height: 180px;

            background:
                radial-gradient(
                    circle,
                    #38bdf8,
                    transparent 70%
                );

            top: 8%;
            left: 8%;
        }

        .orb-two {

            width: 220px;
            height: 220px;

            background:
                radial-gradient(
                    circle,
                    #8b5cf6,
                    transparent 70%
                );

            bottom: 5%;
            right: 8%;

            animation-delay: -3s;
        }

        @keyframes float {

            0%,100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-25px);
            }
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {

            width: 100%;

            max-width: 520px;

            text-align: center;

            animation: appear 1s ease;
        }

        @keyframes appear {

            from {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        /* =========================
           GLOSSY CARD
        ========================= */

        .glass-card {

            position: relative;

            padding: 42px 28px 30px;

            border-radius: 32px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.16),
                    rgba(255,255,255,0.055)
                );

            border: 1px solid var(--border);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            box-shadow:

                0 30px 80px
                rgba(0,0,0,0.45),

                inset 0 1px 1px
                rgba(255,255,255,0.5),

                inset 0 -1px 1px
                rgba(255,255,255,0.08);

            overflow: hidden;
        }


        /* TOP GLASS REFLECTION */

        .glass-card::before {

            content: "";

            position: absolute;

            top: -120px;
            left: -30%;

            width: 160%;
            height: 180px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.20),
                    transparent
                );

            transform: rotate(-8deg);

            pointer-events: none;

            opacity: 0.55;
        }


        /* =========================
           PROFILE
        ========================= */

        .avatar {

            width: 115px;
            height: 115px;

            margin: 0 auto 22px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            font-size: 40px;
            font-weight: 900;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #38bdf8,
                    #6366f1,
                    #8b5cf6
                );

            border:
                3px solid
                rgba(255,255,255,0.75);

            box-shadow:

                0 0 20px
                rgba(56,189,248,0.55),

                0 0 55px
                rgba(99,102,241,0.25),

                inset 0 2px 8px
                rgba(255,255,255,0.45);

            position: relative;

            overflow: hidden;

            animation:
                avatarFloat 4s ease-in-out infinite;
        }

        /* Avatar glossy reflection */

        .avatar::after {

            content: "";

            position: absolute;

            width: 90px;
            height: 35px;

            top: 5px;
            left: 10px;

            background:
                rgba(255,255,255,0.28);

            border-radius: 50%;

            transform: rotate(-20deg);

            filter: blur(4px);
        }

        @keyframes avatarFloat {

            0%,100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }


        h1 {

            font-size: 31px;

            font-weight: 900;

            letter-spacing: -0.5px;

            margin-bottom: 8px;

            text-shadow:
                0 3px 15px
                rgba(255,255,255,0.18);
        }


        .role {

            font-size: 16px;

            font-weight: 700;

            color: #7dd3fc;

            margin-bottom: 15px;

            text-shadow:
                0 0 15px
                rgba(56,189,248,0.45);
        }


        .bio {

            color: var(--light);

            font-size: 14px;

            line-height: 1.7;

            max-width: 410px;

            margin: auto;
        }


        /* =========================
           LINKS
        ========================= */

        .links {

            display: flex;

            flex-direction: column;

            gap: 14px;

            margin-top: 30px;
        }


        .link-card {

            position: relative;

            min-height: 60px;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 15px 55px;

            color: white;

            text-decoration: none;

            font-size: 15px;

            font-weight: 800;

            border-radius: 18px;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.14),
                    rgba(255,255,255,0.045)
                );

            border:
                1px solid
                rgba(255,255,255,0.20);

            box-shadow:

                inset 0 1px 1px
                rgba(255,255,255,0.25),

                0 8px 25px
                rgba(0,0,0,0.20);

            backdrop-filter: blur(12px);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                background 0.3s ease;
        }


        /* Button shine */

        .link-card::before {

            content: "";

            position: absolute;

            top: 0;
            left: -120%;

            width: 80%;
            height: 100%;

            background:
                linear-gradient(
                    110deg,
                    transparent,
                    rgba(255,255,255,0.25),
                    transparent
                );

            transform: skewX(-20deg);

            transition: left 0.6s ease;
        }


        .link-card:hover::before {

            left: 140%;
        }


        .link-card:hover {

            transform:
                translateY(-5px)
                scale(1.015);

            background:
                linear-gradient(
                    135deg,
                    rgba(56,189,248,0.20),
                    rgba(139,92,246,0.18)
                );

            border-color:
                rgba(125,211,252,0.45);

            box-shadow:

                0 15px 35px
                rgba(0,0,0,0.30),

                0 0 25px
                rgba(56,189,248,0.12);
        }


        /* Featured buttons */

        .featured {

            background:
                linear-gradient(
                    135deg,
                    rgba(56,189,248,0.25),
                    rgba(99,102,241,0.24),
                    rgba(139,92,246,0.22)
                );

            border-color:
                rgba(125,211,252,0.35);
        }


        .icon {

            position: absolute;

            left: 17px;

            width: 35px;
            height: 35px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 11px;

            background:
                rgba(255,255,255,0.12);

            border:
                1px solid
                rgba(255,255,255,0.18);

            box-shadow:
                inset 0 1px 2px
                rgba(255,255,255,0.25);

            font-size: 17px;
        }


        .arrow {

            position: absolute;

            right: 18px;

            color: #a9bad1;

            transition:
                transform 0.25s ease,
                color 0.25s ease;
        }


        .link-card:hover .arrow {

            transform: translateX(5px);

            color: white;
        }


        /* =========================
           SOCIAL ICONS
        ========================= */

        .socials {

            display: flex;

            justify-content: center;

            gap: 13px;

            margin-top: 26px;
        }


        .social {

            width: 48px;
            height: 48px;

            display: flex;

            justify-content: center;
            align-items: center;

            border-radius: 15px;

            color: white;

            text-decoration: none;

            font-size: 18px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.13),
                    rgba(255,255,255,0.045)
                );

            border:
                1px solid
                rgba(255,255,255,0.18);

            box-shadow:
                inset 0 1px 1px
                rgba(255,255,255,0.22);

            transition:
                all 0.3s ease;
        }


        .social:hover {

            transform:
                translateY(-5px)
                rotate(2deg);

            background:
                linear-gradient(
                    135deg,
                    rgba(56,189,248,0.25),
                    rgba(139,92,246,0.25)
                );

            box-shadow:
                0 10px 25px
                rgba(0,0,0,0.25),

                0 0 20px
                rgba(56,189,248,0.15);
        }


        /* =========================
           SHARE
        ========================= */

        .share-btn {

            margin-top: 25px;

            padding: 12px 20px;

            border-radius: 14px;

            border:
                1px solid
                rgba(255,255,255,0.18);

            color: #e5f3ff;

            background:
                rgba(255,255,255,0.08);

            box-shadow:
                inset 0 1px 2px
                rgba(255,255,255,0.18);

            cursor: pointer;

            font-size: 13px;

            font-weight: 700;

            transition:
                all 0.3s ease;
        }


        .share-btn:hover {

            transform: translateY(-3px);

            background:
                rgba(56,189,248,0.15);

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.25);
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {

            margin-top: 22px;

            color: #718198;

            font-size: 12px;

            text-shadow:
                0 1px 4px black;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {

                padding:
                    18px 12px;
            }

            .glass-card {

                padding:
                    34px 18px 25px;

                border-radius:
                    25px;
            }

            .avatar {

                width: 96px;
                height: 96px;

                font-size: 34px;
            }

            h1 {

                font-size: 27px;
            }

            .role {

                font-size: 15px;
            }

            .bio {

                font-size: 13px;
            }

            .link-card {

                min-height: 56px;
            }
        }

    </style>
</head>


<body>

    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>

            <!-- SOCIAL -->

            <div class="socials">

                <a

                <a

            <!-- SHARE -->

            <button

            </button>


        </div>


        <footer class="footer">

            © 2026 Mohan Swamy Pala
            · Built with HTML & CSS

        </footer>

    </main>


    <script>

        function shareWebsite() {

            const websiteURL =
                "https://mohanswamy08.github.io";

            if (navigator.share) {

                navigator.share({

                    title:
                        "Mohan Swamy | Personal Links",

                    text:
                        "Check out my personal website:",

                    url:
                        websiteURL

                });

            } else {

                navigator.clipboard
                    .writeText(websiteURL);

                alert(
                    "Website link copied!"
                );
            }
        }

    </script>

</body>
</html>
