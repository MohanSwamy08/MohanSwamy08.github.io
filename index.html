<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mohan Swamy | Personal Links</title>

    <meta name="description" content="All official links of Mohan Swamy Pala in one place.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;
            background:
                radial-gradient(circle at top, #243b55 0%, #141e30 40%, #090d14 100%);
            display: flex;
            justify-content: center;
            padding: 40px 18px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            text-align: center;
        }

        .profile {
            margin-bottom: 28px;
        }

        .avatar {
            width: 105px;
            height: 105px;
            margin: 0 auto 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            box-shadow: 0 10px 35px rgba(0, 114, 255, 0.35);
            border: 3px solid rgba(255,255,255,0.8);
        }

        h1 {
            font-size: 30px;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .role {
            color: #b8c7d9;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .bio {
            color: #d6dce5;
            font-size: 14px;
            line-height: 1.6;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 30px;
        }

        .link-card {
            text-decoration: none;
            color: white;
            width: 100%;
            padding: 17px 22px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.09);
            border: 1px solid rgba(255, 255, 255, 0.13);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.25s ease;
        }

        .link-card:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        .icon {
            position: absolute;
            left: 20px;
            font-size: 21px;
        }

        .footer {
            margin-top: 35px;
            color: #8794a5;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            body {
                padding: 30px 15px;
            }

            h1 {
                font-size: 26px;
            }

            .avatar {
                width: 90px;
                height: 90px;
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <section class="profile">

            <div class="avatar">
                MS
            </div>

            <h1>Mohan Swamy Pala</h1>

            <p class="role">
                AI & Data Science Student
            </p>

            <p class="bio">
                Welcome to my personal space.
                Find all my important links below.
            </p>

        </section>


        <section class="links">

            <a
                class="link-card"
                href="https://github.com/MohanSwamy08"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="icon">💻</span>
                GitHub
            </a>


            <a
                class="link-card"
                href="https://www.linkedin.com/in/pala-mohan-swamy-a965342a0"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="icon">💼</span>
                LinkedIn
            </a>


            <a
                class="link-card"
                href="https://instagram.com/urstrulymohan_08"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="icon">📸</span>
                Instagram
            </a>

        </section>


        <footer class="footer">
            © 2026 Mohan Swamy Pala
        </footer>

    </main>

</body>
</html>
