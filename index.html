<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mohan Swamy | Personal Links</title>

    <meta name="description"
          content="Mohan Swamy Pala - AI & Data Science Student. Explore my portfolio, resume, GitHub and social links.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #07111f;
            --card: rgba(255, 255, 255, 0.075);
            --border: rgba(255, 255, 255, 0.13);
            --text: #ffffff;
            --muted: #aebbd0;
            --blue: #2196ff;
            --blue2: #6c63ff;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 15%, rgba(33, 150, 255, 0.18), transparent 28%),
                radial-gradient(circle at 85% 80%, rgba(108, 99, 255, 0.16), transparent 30%),
                linear-gradient(135deg, #050b14, #0a1728 55%, #07101d);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 35px 16px;

            overflow-x: hidden;
        }

        /* Background glow */

        body::before {
            content: "";
            position: fixed;
            width: 320px;
            height: 320px;
            background: rgba(33, 150, 255, 0.10);
            border-radius: 50%;
            filter: blur(90px);
            top: -100px;
            left: -100px;
            z-index: -1;
        }

        body::after {
            content: "";
            position: fixed;
            width: 300px;
            height: 300px;
            background: rgba(108, 99, 255, 0.10);
            border-radius: 50%;
            filter: blur(90px);
            bottom: -100px;
            right: -100px;
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 560px;
            text-align: center;
            animation: fadeUp 0.8s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Main glass card */

        .card {
            padding: 38px 28px 28px;
            border-radius: 28px;

            background: var(--card);

            border: 1px solid var(--border);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        /* Profile */

        .avatar {
            width: 108px;
            height: 108px;

            margin: 0 auto 20px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 38px;
            font-weight: 800;

            background:
                linear-gradient(135deg, var(--blue), var(--blue2));

            border: 3px solid rgba(255, 255, 255, 0.8);

            box-shadow:
                0 0 0 7px rgba(33, 150, 255, 0.08),
                0 15px 40px rgba(33, 150, 255, 0.25);

            animation: floating 4s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-7px);
            }
        }

        h1 {
            font-size: 31px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .role {
            font-size: 16px;
            color: #73b9ff;
            font-weight: 600;
            margin-bottom: 14px;
        }

        .bio {
            max-width: 430px;
            margin: auto;

            color: var(--muted);

            font-size: 14px;
            line-height: 1.7;
        }

        /* Buttons */

        .links {
            display: flex;
            flex-direction: column;
            gap: 13px;

            margin-top: 30px;
        }

        .link-card {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;

            min-height: 58px;

            padding: 16px 50px;

            border-radius: 16px;

            color: white;
            text-decoration: none;

            font-size: 15px;
            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.10),
                    rgba(255,255,255,0.045)
                );

            border: 1px solid rgba(255,255,255,0.12);

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        .link-card:hover {
            transform: translateY(-4px) scale(1.01);

            background:
                linear-gradient(
                    135deg,
                    rgba(33,150,255,0.18),
                    rgba(108,99,255,0.13)
                );

            border-color: rgba(92, 174, 255, 0.4);

            box-shadow:
                0 12px 30px rgba(0,0,0,0.25);
        }

        .icon {
            position: absolute;
            left: 18px;

            width: 32px;
            height: 32px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: rgba(255,255,255,0.08);

            font-size: 17px;
        }

        .arrow {
            position: absolute;
            right: 18px;

            color: #8291a7;

            transition: transform 0.25s ease;
        }

        .link-card:hover .arrow {
            transform: translateX(4px);
            color: white;
        }

        /* Featured buttons */

        .featured {
            background:
                linear-gradient(
                    135deg,
                    rgba(33,150,255,0.25),
                    rgba(108,99,255,0.20)
                );

            border-color: rgba(100,180,255,0.3);
        }

        /* Social row */

        .socials {
            display: flex;
            justify-content: center;
            gap: 12px;

            margin-top: 25px;
        }

        .social {
            width: 45px;
            height: 45px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            text-decoration: none;
            color: white;

            background: rgba(255,255,255,0.07);

            border: 1px solid rgba(255,255,255,0.10);

            font-size: 18px;

            transition: all 0.25s ease;
        }

        .social:hover {
            transform: translateY(-4px);

            background: rgba(33,150,255,0.18);

            border-color: rgba(33,150,255,0.35);
        }

        /* Share */

        .share-btn {
            margin-top: 24px;

            border: none;

            padding: 11px 18px;

            border-radius: 12px;

            color: #dcecff;

            background: rgba(255,255,255,0.06);

            border: 1px solid rgba(255,255,255,0.09);

            cursor: pointer;

            font-size: 13px;
            font-weight: 600;

            transition: all 0.25s ease;
        }

        .share-btn:hover {
            background: rgba(255,255,255,0.11);
            transform: translateY(-2px);
        }

        /* Footer */

        .footer {
            margin-top: 25px;

            color: #6f7f94;

            font-size: 12px;
        }

        /* Mobile */

        @media (max-width: 600px) {

            body {
                padding: 18px 12px;
                align-items: flex-start;
            }

            .container {
                margin-top: 10px;
            }

            .card {
                padding: 32px 18px 24px;
                border-radius: 23px;
            }

            .avatar {
                width: 94px;
                height: 94px;
                font-size: 33px;
            }

            h1 {
                font-size: 27px;
            }

            .role {
                font-size: 15px;
            }

            .bio {
                font-size: 13px;
            }

            .link-card {
                min-height: 55px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="card">

            <!-- Profile -->

            <div class="avatar">
                MS
            </div>

            <h1>Mohan Swamy Pala</h1>

            <p class="role">
                AI & Data Science Student
            </p>

            <p class="bio">
                Welcome to my personal space.
                Explore my portfolio, projects, resume and social profiles.
            </p>


            <!-- Main Links -->

            <section class="links">

                <a
                    class="link-card featured"
                    href="https://mohanswamy08.github.io/Mohan-Portfolio/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span class="icon">🌐</span>
                    My Portfolio
                    <span class="arrow">→</span>
                </a>


                <a
                    class="link-card featured"
                    href="resume.pdf"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span class="icon">📄</span>
                    My Resume
                    <span class="arrow">→</span>
                </a>


                <a
                    class="link-card"
                    href="https://github.com/MohanSwamy08"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span class="icon">💻</span>
                    GitHub
                    <span class="arrow">→</span>
                </a>


                <a
                    class="link-card"
                    href="https://www.linkedin.com/in/pala-mohan-swamy-a965342a0"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span class="icon">💼</span>
                    LinkedIn
                    <span class="arrow">→</span>
                </a>


                <a
                    class="link-card"
                    href="https://instagram.com/urstrulymohan_08"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span class="icon">📸</span>
                    Instagram
                    <span class="arrow">→</span>
                </a>

            </section>


            <!-- Social icons -->

            <div class="socials">

                <a
                    class="social"
                    href="https://github.com/MohanSwamy08"
                    target="_blank"
                    rel="noopener noreferrer"
                    title="GitHub"
                >
                    💻
                </a>

                <a
                    class="social"
                    href="https://www.linkedin.com/in/pala-mohan-swamy-a965342a0"
                    target="_blank"
                    rel="noopener noreferrer"
                    title="LinkedIn"
                >
                    💼
                </a>

                <a
                    class="social"
                    href="https://instagram.com/urstrulymohan_08"
                    target="_blank"
                    rel="noopener noreferrer"
                    title="Instagram"
                >
                    📸
                </a>

            </div>


            <!-- Share -->

            <button class="share-btn" onclick="shareWebsite()">
                🔗 Share My Website
            </button>

        </div>


        <footer class="footer">
            © 2026 Mohan Swamy Pala · Built with HTML & CSS
        </footer>

    </main>


    <script>
        function shareWebsite() {

            const websiteURL = "https://mohanswamy08.github.io";

            if (navigator.share) {

                navigator.share({
                    title: "Mohan Swamy | Personal Links",
                    text: "Check out my personal website:",
                    url: websiteURL
                });

            } else {

                navigator.clipboard.writeText(websiteURL);

                alert("Website link copied!");

            }
        }
    </script>

</body>
</html>
